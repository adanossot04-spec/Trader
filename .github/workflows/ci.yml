name: tests

# Тести офлайнові: без мережі, без ключів, без TradingAgents — тому CI працює
# безкоштовно і не вимагає жодних секретів репозиторію.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Встановити залежності
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Перевірити, що дані середовища не просочилися в репозиторій
        run: |
          if [ -f .env ]; then
            echo "::error::у репозиторії є файл .env — видаліть його з git і додайте в .gitignore"
            exit 1
          fi
          if [ -f data/assistant.db ]; then
            echo "::warning::у репозиторії є data/assistant.db — журнал угод не має комітитись"
          fi

      - name: Тести
        run: python -m pytest tests -q
